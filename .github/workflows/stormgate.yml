name: Storm Gate

on:
  push:
    paths:
      - "stormgate/**"
      - ".github/workflows/stormgate.yml"
  pull_request:
    paths:
      - "stormgate/**"
      - ".github/workflows/stormgate.yml"

permissions:
  contents: read

concurrency:
  group: stormgate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stormgate

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stormgate
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  checks:
    name: Scripts, patches and profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stormgate
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck scripts/*.sh scripts/lib/*.sh
      - run: scripts/check-patches.sh
      - run: cargo run -q --locked -p stormgate-cli -- profile validate --shared profiles/template.toml
      - run: cargo run -q --locked -p stormgate-cli -- profile check-db compat

  windows-smoke:
    name: Synthetic Windows tests (launcher smoke, Linux Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stormgate
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64 wine64
      - run: make -C tests/windows
      - name: stormgate test hello
        env:
          STORMGATE_HOME: ${{ runner.temp }}/stormgate
          STORMGATE_WINE: /usr/lib/wine/wine64
        run: cargo run -q --locked -p stormgate-cli -- test hello
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stormgate-logs
          path: ${{ runner.temp }}/stormgate/logs

  # Real runtime build and GPU tests need Apple Silicon hardware. Enable by
  # setting the repository variable STORMGATE_SELF_HOSTED=true once a
  # self-hosted runner labelled [self-hosted, macOS, ARM64] exists.
  # Never runs for pull requests (untrusted code) and never has credentials.
  macos-runtime:
    name: Runtime build + GPU tests (self-hosted Mac)
    if: vars.STORMGATE_SELF_HOSTED == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap
      - run: make runtime
      - run: make install-runtime
      - run: make windows-tests
      - run: |
          for t in hello win32-window d3d11-triangle; do
            target/release/stormgate test "$t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: stormgate-runtime
          path: |
            stormgate/dist/*.tar.gz
            stormgate/dist/SHA256SUMS
            stormgate/dist/SBOM.spdx.json
            stormgate/dist/sources.lock
